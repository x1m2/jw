fastlio_localization:
    ros__parameters:
        lidar_topic:  "/rslidar_front/points"
        imu_topic:  "/rslidar_front/imu"
        use_gnss: false
        map_frame:  "map"
        lidar_frame:  "rslidar_front"
        baselink_frame:  "base_link"
        timedelay_lidar2imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).

        lidar_type: 5                # RoboSense Airy PointCloud2
        scan_line: 96
        scan_rate: 10
        timestamp_unit: 0           # Per-point timestamp is in seconds
        blind: 0.5
        det_range: 100.0

        gravity_init: [0., 0., -9.81]         # [0.0, 9.810, 0.0] # preknown gravity in the first IMU body frame, use when imu_en is false or start from a non-stationary state
        frontend_type: 0                    # frontend type

        # fastlio
        point_skip_num: 6
        space_down_sample: true
        surf_frame_ds_res: 0.2
        max_iteration: 3
        ikdtree_resolution: 0.2
        lidar_model_search_range: 5.
        lidar_meas_cov: 0.001
        cube_side_length: 1000
        runtime_log_enable: 0

        acc_cov: 0.1
        gyr_cov: 0.1
        b_acc_cov: 0.0001
        b_gyr_cov: 0.0001
        extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
        # Airy LiDAR pose in the IMU frame; verify for the recording device.
        extrinsic_T: [0.0042, -0.015, 0.011]
        extrinsic_R: [0.0371031, -0.999192, 0.0154193,
                      -0.999305, -0.037043, 0.00416679,
                      -0.00359224, -0.0155632, -0.999872]

        # imu -> gnss
        extrinsicT_imu2gnss: [ 0., 0., 0. ]
        extrinsicR_imu2gnss: [ 1., 0., 0.,
                               0., 1., 0.,
                               0., 0., 1. ]

        path_en:  true
        scan_publish_en:  true       # false: close all the point cloud output
        dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
        lidar_tf_broadcast: true
        imu_tf_broadcast: false

        map_path: "/robotfs/data/slam_data/map/"

        relocate_use_last_pose: false
        # last_pose_record_path: "/home/will/last_pose_record.txt"
        location_log_enable: false
        # location_log_save_path: "/home/will/location.log"

# ============relocalization_cfg============
        algorithm_type: "bbs3d"

        utm_origin_zone: "51N"
        utm_origin_east: 536808.26993
        utm_origin_north: 4501498.61740
        utm_origin_up: 44.21500

        lidar_height: 2.183
        sc_dist_thres: 0.7

        ################[Necessary]################
        ## 3D-BBS parameters
        bbs3d_min_level_res: 0.5 # [m], e.g. outdoor: 1.0, indoor: 0.5
        bbs3d_max_level: 6

        ## Angular search range [rad]
        # 6.28 input is converted to 2*M_PI
        # true时输入点云已重力对齐，roll/pitch应配置为零附近的残差范围；
        # false时输入仍在原始雷达系，应改回雷达实际安装姿态范围。
        # 同时控制BBS3D全局搜索和manually_set初始位姿BnB的重力对齐。
        bbs3d_gravity_align: true
        bbs3d_min_rpy: [-0.03,-0.03,0.0] # [roll, pitch, yaw]
        bbs3d_max_rpy: [0.03,0.03,6.28] # [roll, pitch, yaw]
        ## Score threshold
        # score_threshold = floor(src_points.size() * score_threshold_percentage)
        bbs3d_score_threshold_percentage: 0.9

        bbs3d_num_threads: 6
        ################[Optional]################
        ## Downsample target clouds [m]
        bbs3d_tar_leaf_size: 0.1 # off: 0.0

        ## Downsample source clouds [m]
        bbs3d_src_leaf_size: 2.0 # off: 0.0

        ## Crop source clouds [m]
        bbs3d_min_scan_range: 0.0 # [m]
        bbs3d_max_scan_range: 100.0 # [m]
        # off: set 0.0 to both min_scan_range and max_scan_range

        ## Timeout [msec]
        # Enter the number as int
        bbs3d_timeout_msec: 0 # off: 0

        ## Final align (evaluate the error)
        bbs3d_use_gicp: false

        # BnB参数按重定位场景选择；slam_manager启动时覆盖此profile。
        relocalization_profile: "initial"
        bnb3d:
            initial:
                linear_xy_window_size: 4.0   # meter
                linear_z_window_size: 0.5    # meter
                angular_search_window: 100.0 # degree 0~180
                pc_resolutions: [0.3, 0.5, 0.8]
                depth: 3
                min_score: 0.3
                enough_score: 0.7
                min_xy_resolution: 0.2
                min_z_resolution: 0.1
                min_angular_resolution: 5.0  # degree
                filter_size_scan: 0.5
                debug_mode: false

            map_connection:
                linear_xy_window_size: 2.5   # meter
                linear_z_window_size: 0.5    # meter
                angular_search_window: 30.0 # degree 0~180
                pc_resolutions: [0.3, 0.5, 0.8]
                depth: 3
                min_score: 0.3
                enough_score: 0.7
                min_xy_resolution: 0.2
                min_z_resolution: 0.1
                min_angular_resolution: 5.0  # degree
                filter_size_scan: 0.5
                debug_mode: false

        ndt_step_size: 0.1
        ndt_resolution: 1.

        gicp_use_gicp: false
        gicp_filter_range: 80.0
        gicp_downsample: 0.1
        gicp_search_radius: 0.5
        gicp_teps: 1.0e-4
        gicp_feps: 0.001
        gicp_fitness_score: 0.3
