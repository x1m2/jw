robot_runtime:
  ros__parameters:
    # APP只传map_id，RobotRuntime在该根目录下管理每张地图。
    map_storage:
      root_directory: "/robotfs/data/slam_data/map"
      max_maps: 5
      finish_mapping_timeout_sec: 300.0

    # APP加载地图时读取该PCD并发布一次，不会启动定位算法。
    map_display:
      pcd_filename: "globalmap.pcd"
      topic: "/robot/map/point_cloud"
      frame_id: "map"

    # 开始定位Service等待重定位成功；超时后停止定位并返回失败。
    localization:
      relocalization_timeout_sec: 60.0
      stop_timeout_sec: 10.0

    # 暂停/继续导航时，等待纯跟踪速度控制接口响应的最长时间。
    navigation:
      control_timeout_sec: 3.0
