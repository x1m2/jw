slam_manager:
  ros__parameters:
    # APP传字符串map_id（例如floor_1），直接对应 <root>/<map_id>/。
    map_storage:
      root_directory: "/robotfs/data/slam_data"
      max_maps: 500
      # start_mapping等待PGO和Fast-LIO节点级Ready。
      start_mapping_timeout_sec: 30.0
      finish_mapping_timeout_sec: 300.0

    # 开始定位Action等待重定位成功；超时后停止定位并返回失败。
    localization:
      worker_service: "/fastlio_localization_worker/set_state"
      relocalization_timeout_sec: 60.0
      stop_timeout_sec: 10.0
      # load_map每次都运行该工具，基于当前globalmap.pcd重新生成voxelmaps_coords。
      bbs:
        saver_executable: "/robotfs/app/module/slam/localization/voxelmaps_saver"
        min_level_resolution: 0.5
        max_level: 6
        generation_timeout_sec: 120.0

    imu_calibration:
      # topic和extrinsic_R由后加载的机体YAML提供；静止倾角标定不需要平移。
      sample_count: 200
      timeout_sec: 5.0
      # 静止采样质量门限：角速度RMS（rad/s）、加速度向量标准差/均值模长。
      max_gyro_rms_rad_s: 0.05
      max_accel_relative_std: 0.02
      # IMU初标定后默认继续拟合前雷达地面。
      ground_fitting:
        enabled: true
        # 地面选区需有足够覆盖：纵向至少1.5 m、横向至少1.0 m。
        x_min: 2.0
        x_max: 5.0
        y_min: -1.5
        y_max: 1.5
        # base_link原点到地面的垂直距离，单位米，填正数。
        base_height_m: 0.5
        # 地面取点允许的上下偏差，单位米。
        height_tolerance_m: 0.4

    # 导航Worker启停、暂停控制和单个目标点执行超时。
    navigation:
      control_timeout_sec: 3.0
      worker_timeout_sec: 30.0
      goal_timeout_sec: 1200.0
      # true时启用/SetMode和/GetState状态检查；false时同时关闭两者。
      # 启动时读取，修改后需重启slam_manager。
      enable_set_mode: true
      # 首次执行巡检时，若当前二维位置距离首点不超过该阈值，则从第二点开始。
      enable_skip_first_target: true
      skip_first_target_threshold: 0.8
      # 当前边会用该值覆盖局部规划器YAML中的avoid_max_distance。
      default_edge_policy:
        obstacle_avoidance_enabled: false
        obstacle_avoidance_distance_m: 1.5

    publish:
      # /robot/cloud_body对APP的发布频率
      body_cloud_hz: 5.0
