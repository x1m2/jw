/**:
  ros__parameters:
    # 坐标系参数
    global_frame: "map"
    robot_base_frame: "base_link"

    # 使用terrain_filter输出的base_link障碍物点云。
    # lidar_type非1表示标准PointCloud2。
    lidar_type: 2
    livox_topic: "/obstacle_cloud"
    lidar_frame: "base_link"
    pointcloud2_in_base_frame: true
    pointcloud2_apply_height_filter: true # PointCloud2按min_height/max_height过滤高度

    # 在 base_link 坐标系中裁剪点云并投影为内部二维射线
    min_height: 0.2
    max_height: 1.3
    angle_min: -3.1415926
    angle_max: 3.1415926
    angle_increment: 0.0087
    range_min: 0.4
    range_max: 8.0

    # 地图参数
    resolution: 0.05
    width: 400
    height: 400

    # 障碍物检测参数
    max_obstacle_range: 8.0
    min_obstacle_range: 0.35
    # /costmap在绕障非IDLE阶段使用此半径；A*使用自身固定膨胀参数。
    inflation_radius: 0.25
    # IDLE：正常路径跟踪。0.03小于当前0.05m栅格，不覆盖相邻格。
    tracking_inflation_radius: 0.03

    # 俯仰角检测参数
    enable_pitch_detection: true
    max_pitch_angle: 18.0
    pitch_recovery_time: 2.0

    # 时间衰减参数
    use_time_decay: true
    obstacle_max_age: 0.8
