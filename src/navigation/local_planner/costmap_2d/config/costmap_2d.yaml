costmap_2d_node:
  ros__parameters:
    # 坐标系参数
    global_frame: "map"
    robot_base_frame: "base_link"

    # Livox MID-360 原始点云输入
    livox_topic: "/livox/lidar"
    lidar_frame: "livox_frame"

    # 雷达在 base_link 坐标系中的固定外参（单位：m、rad）
    lidar_x: 0.28
    lidar_y: 0.0
    lidar_z: 0.70
    lidar_roll: 0.0
    lidar_pitch: 0.4119
    lidar_yaw: 0.0

    # 在 base_link 坐标系中裁剪点云并投影为内部二维射线
    min_height: 0.2
    max_height: 1.3
    angle_min: -3.1415926
    angle_max: 3.1415926
    angle_increment: 0.0087
    range_min: 0.4
    range_max: 8.0

    # 地图参数
    resolution: 0.05
    width: 400
    height: 400

    # 障碍物检测参数
    max_obstacle_range: 8.0
    min_obstacle_range: 0.35
    inflation_radius: 0.25

    # 俯仰角检测参数
    enable_pitch_detection: true
    max_pitch_angle: 18.0
    pitch_recovery_time: 2.0

    # 时间衰减参数
    use_time_decay: false
    obstacle_max_age: 1.0
    decay_rate: 0.80
