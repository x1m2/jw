/**:
  ros__parameters:
    # P2.5单MID360s原始点云；外参来自p2.5_mid360s.yaml。
    lidar_type: 1
    planned_cmd_topic: "/cmd_vel_planned"
    safe_cmd_topic: "/cmd_vel"

    # 点云转到base_link后裁剪，并使用XY坐标构建障碍栅格。
    min_height: -0.35
    max_height: 0.5
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    range_min: 0.0
    range_max: 1.5

    # 内部栅格对同一位置的点去重，不发布为导航costmap。
    # 每格在当前帧内达到此有效点数才占用；高度跨度不作触发门槛。
    min_points_per_cell: 1
    grid_resolution: 0.05
    grid_width: 80
    grid_height: 50

    # 区域厚度沿车体轴计算；前后基准为雷达原点，左右基准为车身侧边。
    zones:
      front:
        enabled: true
        sources: [front]
        stop_distance: 0.30
        slowdown_distance: 0.20
        obstacle_cell_threshold: 1
      rear:
        enabled: false
        sources: [rear]
        stop_distance: 0.30
        slowdown_distance: 0.20
        obstacle_cell_threshold: 1
      left:
        enabled: true
        sources: [front]
        stop_distance: 0.10
        obstacle_cell_threshold: 1
      right:
        enabled: true
        sources: [front]
        stop_distance: 0.10
        obstacle_cell_threshold: 1

    linear_velocity_factor: 0.40
    angular_velocity_factor: 1.0
    hard_stop_clear_delay: 0.30
    slowdown_clear_delay: 0.50

    directional_release_enabled: false
    directional_center_half_width: 0.20
    directional_escape_velocity_threshold: 0.05
    center_lateral_escape_enabled: false
    center_escape_max_forward_velocity: 0.02
    center_escape_max_angular_velocity: 0.10

    lidar_timeout_sec: 0.30
    command_timeout_sec: 0.30
    control_frequency: 30.0
    publish_visualization: true
