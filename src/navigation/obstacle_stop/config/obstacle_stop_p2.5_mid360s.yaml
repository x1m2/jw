/**:
  ros__parameters:
    # P2.5单MID360s原始点云；外参来自p2.5_mid360s.yaml。
    lidar_type: 1
    planned_cmd_topic: "/cmd_vel_planned"
    safe_cmd_topic: "/cmd_vel"

    # 点云转到base_link后裁剪，并使用XY坐标构建障碍栅格。
    min_height: -0.35
    max_height: 0.5
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    range_min: 0.0
    range_max: 1.5

    # 内部栅格对同一位置的点去重，不发布为导航costmap。
    # 每格在当前帧内达到此有效点数才占用；高度跨度不作触发门槛。
    min_points_per_cell: 2
    grid_resolution: 0.03
    grid_width: 100
    grid_height: 100

    # 区域厚度沿车体轴计算；前后基准为雷达原点，左右基准为车身侧边。
    zones:
      front:
        enabled: true
        sources: [front]
        stop_distance: 0.30
        slowdown_distance: 0.20
        obstacle_cell_threshold: 5
      rear:
        enabled: false
        sources: [rear]
        stop_distance: 0.30
        slowdown_distance: 0.20
        obstacle_cell_threshold: 5
      left:
        enabled: true
        sources: [front]
        stop_distance: 0.10
        obstacle_cell_threshold: 5
      right:
        enabled: true
        sources: [front]
        stop_distance: 0.10
        obstacle_cell_threshold: 5

    linear_velocity_factor: 0.40
    angular_velocity_factor: 1.0
    hard_stop_clear_delay: 0.30
    slowdown_clear_delay: 0.50

    # STOP仅检测净空、反馈状态并校验SCAN速度；脱困动作流程由SCAN负责。
    planner_velocity_guard_enabled: true  # 允许校验并放行规划器横移/后退模式；没有模式消息不自动横移。
    planner_velocity_limit: 0.25  # 规划器横移/后退速度上限(m/s)；指令+y向右、-y向左。
    clearance_check_distance: 0.50 # 从目标方向停止区外边界再向外预检的距离(m)，不含停止区。
    planner_motion_mode_timeout_sec: 0.30 # 模式源时间和接收心跳超时(s)，模式话题须持续发布。

    lidar_timeout_sec: 0.30
    command_timeout_sec: 0.30
    control_frequency: 30.0
    publish_visualization: true

    # Woodox设备姿态；持续倾斜只屏蔽减速，停止区和其他保护仍然生效。
    # 未收到有效IMU或超时则恢复正常减速。此功能也会识别坡道倾斜。
    imu_stairs:
      enabled: true
      topic: /imu/data
      frame: woodox_imu
      # R_base_imu，旋转IMU坐标轴到车体坐标轴；roll/pitch/yaw，单位rad。
      imu_to_base_rpy: [0.0, 0.0, 0.0]
      pitch_baseline_deg: 0.0
      enter_angle_deg: 14.0
      exit_angle_deg: 10.0
      filter_time_constant_sec: 0.15
      enter_duration_sec: 0.15
      exit_duration_sec: 0.40
      timeout_sec: 0.30
