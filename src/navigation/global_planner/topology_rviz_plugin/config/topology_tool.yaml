rviz_topology:
  ros__parameters:
    tool_manager.tool_plugins:
      - topology_rviz_plugin/TopologyTool

    topology_tool:
      marker_topic: "topology_markers"
      point_topic: "topology_points"
      pcd_file: "${ROBOT_DATA_DIR}/map/result_free_space.pcd"

      node_label: "节点"

      selection_threshold: 0.3
      bidirectional: true

      save_file: "${ROBOT_DATA_DIR}/topology_map/connected_topology_map.txt"
      auto_load_topology: true
