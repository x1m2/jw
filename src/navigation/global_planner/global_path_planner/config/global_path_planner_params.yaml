/**:
  ros__parameters:
    # 基本参数 
    # 实时定位位姿话题，类型：geometry_msgs/msg/PoseStamped
    topology_map_file: "/robotfs/data/slam_data/map_0/task/topology_map.json"
    global_frame: "map"
    pose_topic: "/pose_stamped_localization"
    # 路径规划参数
    connection_distance_threshold: 5.0   #临时点连接第二层拓扑邻居的最大距离，单位：米
    interpolation_spacing_m: 0.2  # 全局路径相邻插值点的目标间距（米）
    # 仅到点任务及 clicked_point 启用；拓扑巡检仍按指定边执行。
    deviation_replan_enabled: true
    deviation_replan_distance: 0.5       # 到实际跟踪路径线段的 XY 距离（米）
    deviation_replan_confirm_sec: 0.5    # 连续偏离确认时间，抑制定位抖动
    deviation_replan_interval_sec: 1.0   # 规划失败/等待控制器接收时的最小重试间隔
    deviation_replan_goal_tolerance: 0.2 # 终点附近不重规划，留给控制器完成调角
    deviation_replan_pose_timeout_sec: 0.5 # 拒绝过期定位（回放需使用一致的 ROS 时钟）
    resume_replan_distance: 0.25         # 暂停后人工移动超过此距离，恢复时从当前位置重规划（米）
    # true：距离小于 direct_connection_threshold 时，可直接生成 start_temp -> goal_temp 直连边。
    # false：优先按 navigation_topology JSON 中的边规划。
    enable_direct_connection: false
    # 只有 enable_direct_connection=true 时才主要生效。
    direct_connection_threshold: 3.0
    direct_connection_cost_ratio: 0.9  # 直接连接的权重是距离的多少倍，<1表示给直接连接一个奖励
    # 边合法性检查参数（基于可行域点云）
    robot_height: 0.35
    edge_sample_count: 100
    safety_sphere_radius: 0.3
    valid_point_threshold: 0.9
    free_space_pcd_file: "/robotfs/data/slam_data/map_0/map/result_free_space.pcd"

    # 是否对临时连接做可行域点云合法性检查。
    # true：会使用 free_space_pcd_file 加载的可行域 PCD 检查边是否可走；
    #      如果 PCD 文件不存在或为空，可能导致所有临时连接失败。
    # false：不做点云合法性检查，只按拓扑和距离规则连接。
    # 当前没有可靠 result_free_space.pcd 时建议 false。
    enable_temp_connection_feasibility_check: false
