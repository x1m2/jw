uwb_follow_planner_node:
  ros__parameters:
    # ==================== 话题与坐标系 ====================
    # UWB 测距/测角数据输入话题
    uwb_topic: "/libAoa_robot_publisher"
    # true：订阅BLE命令，必须收到data=0才开始跟随；false：不订阅并自动跟随。
    enable_follow_command_topic: true
    # BLE事件命令（非心跳）：0开始/恢复，1暂停，2停止；未发布时保持上次状态。
    follow_command_topic: "/ble_follow_cmd"
    # FAST-LIO2 建图期间输出的实时里程计，类型 nav_msgs/msg/Odometry。
    odometry_topic: "/Odometry"
    # 跟随路径输出话题。
    path_topic: "/global_path_with_policy"
    # 必须与 /Odometry.header.frame_id 以及下游跟踪/Costmap坐标系一致。
    global_frame: "odom"

    # ==================== UWB 数据解析 ====================
    # 输入消息只包含 float64 r 和 float64 a。
    # r 表示距离；a 使用角度制，正前方为 0°，逆时针为正，顺时针为负。
    # 距离 r 的单位换算系数，换算后的单位为米；r 已为米时保持 1.0。
    range_scale: 1.0
    # 可接受的最小/最大 UWB 距离（米），超出范围的测量将被丢弃
    minimum_range: 0.2
    maximum_range: 30.0

    # ==================== UWB 安装外参 ====================
    # UWB 正前方相对 base_link 正前方的偏航角（角度），逆时针为正。
    bearing_offset_degrees: 0.0
    sensor_offset_x: 0.10
    sensor_offset_y: 0.0

    # ==================== 测量滤波与人员轨迹 ====================
    # 一阶低通滤波系数，范围 (0, 1]；越大越灵敏，越小越平滑但延迟越大
    filter_alpha: 0.35
    # 允许的人员最大移动速度（米/秒），用于识别异常跳点
    maximum_person_speed: 4.0
    # 跳点判定的固定余量（米）；允许位移 = 速度上限 × 时间间隔 + 该余量
    jump_margin: 0.8
    # 人员移动达到该距离后才向历史轨迹追加一个采样点（米）
    trail_sample_distance: 0.25
    # 历史轨迹的最长保留时间（秒）
    trail_keep_seconds: 45.0
    # 历史轨迹最多保留的点数，避免轨迹无限增长
    maximum_trail_points: 400
    # 短时间内回到已有轨迹附近时的轨迹合并半径（米）
    short_loop_merge_radius: 0.4
    # 只对该时间范围内的短回环执行合并（秒）
    short_loop_max_age: 4.0
    # 输出路径相邻点的目标间距（米）
    path_point_spacing: 0.05

    # ==================== 跟随状态与距离滞回 ====================
    # 机器人期望保持在人员后方的跟随距离（米）
    follow_distance: 1.5
    # HOLD 状态下，人员距离达到该值后允许开始跟随（米）
    start_follow_distance: 1.9
    # FOLLOWING 状态下，人员距离小于等于该值时停止前进（米）
    # 必须小于 start_follow_distance，二者之间的差值用于避免状态抖动。
    stop_follow_distance: 1.6
    # 判断机器人已经到达当前跟随目标的容差半径（米）
    hold_radius: 0.35
    # 人员累计移动超过该距离后，才认为人员确实开始移动（米）
    start_move_distance: 0.7
    # 人员持续移动达到该时长后才确认移动状态（秒），用于抑制测量噪声
    movement_confirm_time: 0.6
    # 从机器人看，当前人员方向与已锁定目标方向的夹角超过该值时更新目标（度）
    target_angle_update_threshold_degrees: 5.0
    # 即使方向不变，实时候选目标相对已锁定目标移动超过该距离也更新（米）
    target_position_update_threshold: 0.4
    # 超过该时间未收到有效 UWB 数据则认为目标丢失（秒）
    uwb_timeout: 0.5
    # 目标丢失但已有已发布的跟随目标时，继续行驶至该旧目标；到达后停车。
    # false 时保持旧行为：UWB 超时立即暂停 Pure Pursuit。
    continue_to_last_goal_on_uwb_timeout: true
    # 超过该时间未收到有效机器人位姿则认为定位失效，并暂停跟随（秒）
    pose_timeout: 0.5
    # 跟随路径的计算与发布频率（赫兹）
    planning_frequency: 8.0

    # ==================== Pure Pursuit 联动 ====================
    # true：在保持状态、定位超时或未保留旧目标的 UWB 超时时，主动暂停 Pure Pursuit；
    # false：只停止更新跟随路径，不管理 Pure Pursuit 的暂停状态。
    manage_pure_pursuit_pause: true

    obstacle_stop_enabled: true
    # UWB 跟随允许局部规划器接管运动并生成 A* 绕障路径
    obstacle_avoidance_enabled: true
    # 发布到PathWithPolicy的绕障检测距离
    obstacle_avoidance_distance_m: 1.8
