/**:
  ros__parameters:
      robot_model: "P3"
      lidar_model: "AIRY96"

      # P3 Airy96机器人外形尺寸，单位m。
      robot_width: 0.60
      robot_length: 1.10

      # 雷达输入；stop的zones通过front/rear名称引用。
      lidars:
        front:
          enabled: true
          topic: "/rslidar_front/points"
          frame: "rslidar_front"
        rear:
          enabled: true
          topic: "/rslidar_rear/points"
          frame: "rslidar_rear"

      # 前Airy96雷达坐标系在base_link中的位姿。
      lidar_to_base:
        translation: [0.47, 0.0, -0.05]  # 米；p_base = R * p_lidar + t
        rotation:
          type: matrix
          # 按行排列；本次IMU倾斜修正结果，与临时TF验证参数一致。
          value: [0.010419, -0.003297, 0.999940,
                  -0.120501, 0.992703, 0.004529,
                  -0.992659, -0.120541, 0.009945]

      # 后Airy96雷达坐标系在base_link中的位姿。
      rear_lidar_to_base:
        translation: [-0.47, 0.0, -0.07]  # 米；p_base = R * p_lidar + t
        rotation:
          type: matrix
          # 按行排列；后雷达IMU倾斜修正结果，与临时TF验证参数一致。
          value: [0.013768, 0.000235, -0.999905,
                  0.008612, -0.999963, -0.000116,
                  -0.999868, -0.008609, -0.013769]

      imu_calibration:
        topic: "/rslidar_front/imu"
        # LiDAR到IMU的旋转；静止倾角标定不需要平移。
        extrinsic_R: [0.0371031, -0.999192, 0.0154193,
                      -0.999305, -0.037043, 0.00416679,
                      -0.00359224, -0.0155632, -0.999872]
