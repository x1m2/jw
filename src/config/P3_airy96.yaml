/**:
  ros__parameters:
      robot_model: "P3"
      lidar_model: "AIRY96"

      # P3 Airy96机器人外形尺寸，单位m。
      robot_width: 0.60
      robot_length: 1.10

      # 雷达输入；stop的zones通过front/rear名称引用。
      lidars:
        front:
          enabled: true
          topic: "/rslidar_front/points"
          frame: "rslidar_front"
        rear:
          enabled: true
          topic: "/rslidar_rear/points"
          frame: "rslidar_rear"

      # 前Airy96雷达坐标系在base_link中的位姿。
      lidar_to_base_T: [0.47, 0.0, -0.05]       # [x, y, z]
      lidar_to_base_R: [0.0, 1.53, 0.0]       # [roll, pitch, yaw]

      # 后Airy96雷达坐标系在base_link中的位姿。
      rear_lidar_to_base_T: [-0.47, 0.0, -0.07] # [x, y, z]
      rear_lidar_to_base_R: [0.0, 1.53, 3.141592653589793]  # [roll, pitch, yaw]

      imu_calibration:
        topic: "/rslidar_front/imu"
        # LiDAR到IMU的旋转；静止倾角标定不需要平移。
        extrinsic_R: [0.0371031, -0.999192, 0.0154193,
                      -0.999305, -0.037043, 0.00416679,
                      -0.00359224, -0.0155632, -0.999872]
